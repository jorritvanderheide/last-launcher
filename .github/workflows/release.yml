# On a version tag (v1.2.3, matching the version in pubspec.yaml): the CI
# checks, then the App Bundle for Google Play and the APKs, signed, with
# their checksums, in a draft GitHub release. The files get a build
# provenance attestation.
name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ci]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The tag is v plus the version in pubspec.yaml, and the stores need
      # release notes for its version code.
      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "${GITHUB_REF_NAME#v}" != "${version%%+*}" ]; then
            echo "tag $GITHUB_REF_NAME, pubspec.yaml $version"; exit 1
          fi
          notes="fastlane/metadata/android/en-US/changelogs/${version##*+}.txt"
          if [ ! -f "$notes" ]; then echo "missing $notes"; exit 1; fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # F-Droid's build recipe takes its Flutter version from the
      # flutter-version line below, in single quotes: keep it that way. It
      # must be the dev shell's Flutter, which made pubspec.lock, or F-Droid
      # can't build; nix flake check makes sure.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.2'
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s\n' \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=upload" \
            "storeFile=../upload-keystore.jks" \
            > android/key.properties

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build App Bundle (Play Store)
        run: flutter build appbundle --release

      - name: Build APKs (F-Droid)
        run: flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64 --dart-define=STORE=fdroid

      - name: Rename APK artifacts
        working-directory: build/app/outputs/flutter-apk
        run: |
          mv app-arm64-v8a-release.apk last-launcher-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk last-launcher-armeabi-v7a.apk

      - name: Verify APK signatures
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          for apk in build/app/outputs/flutter-apk/last-launcher-*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Generate SHA256 checksums
        run: |
          ( cd build/app/outputs/flutter-apk && sha256sum last-launcher-*.apk )  > SHA256SUMS
          ( cd build/app/outputs/bundle/release && sha256sum app-release.aab )  >> SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/last-launcher-*.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v1.2.0-rc.1 are pre-releases.
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          # The notes are the version's part of CHANGELOG.md, if it has one.
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          notes=(--generate-notes)
          if grep -q '[^[:space:]]' notes.md; then notes=(--notes-file notes.md); fi
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/last-launcher-*.apk \
            SHA256SUMS \
            --verify-tag --draft "${prerelease[@]}" --title "Last Launcher ${GITHUB_REF_NAME#v}" "${notes[@]}"
